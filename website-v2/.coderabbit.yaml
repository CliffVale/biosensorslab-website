# CodeRabbit AI Code Review Configuration
# Docs: https://docs.coderabbit.ai

language: en-US

reviews:
  # Auto-review on every PR
  auto_review:
    enabled: true
    # Only review when files change
    drafts: false
    # Base branch to compare against
    base_branches:
      - main

  # Review settings
  path_instructions:
    - path: "**/*.astro"
      instructions: |
        This is an Astro component. Check for:
        - Proper Astro component syntax
        - Tailwind CSS usage
        - Accessibility (ARIA labels, alt text)
        - Performance (lazy loading, image optimization)
    - path: "**/*.tsx"
      instructions: |
        This is a React/TypeScript component. Check for:
        - TypeScript type safety
        - React best practices
        - Component props validation
    - path: "**/*.css"
      instructions: |
        This is a CSS/Tailwind file. Check for:
        - Consistent styling patterns
        - Responsive design
        - Dark mode support

  # Chat settings for PR comments
  chat:
    auto_reply: true

  # Tools to use
  tools:
    ruff:
      enabled: false  # Python linter (not needed for this project)
    ast-grep:
      enabled: true
